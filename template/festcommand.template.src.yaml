# FestCommand: a multi-room esports & event-ops war room, as a Switch template.
#
# SOURCE FILE. Edit this file, then run `python scripts/build_template.py` to
# produce ../festcommand.template.yaml, the file you import into Switch.
# Each `"@include <path>"` value below is replaced with that file's contents
# as a YAML block scalar. Agent instructions come from agents/*/SKILL.md (with
# their front matter stripped), and room documents come from documents/.
# That way the template, the skills and the documents can't drift apart.
#
# Written in version 2 of the Switch template language (docs/TEMPLATES.md in
# sandbox-quantum/switch) because it creates three agents, three rooms and a
# group of linked rooms in one pass:
#
#   helpdesk ──disputes & results──▶ ops ──payout triggers──▶ finance
#            ◀──approved announcements──
#
# Topology at a glance
#   agent            rooms it is in            addressing
#   concierge        helpdesk, ops             anyone in helpdesk or ops
#   bracket_marshal  ops                       owner-agents (Fest Lead + agents)
#   sponsor_tracker  ops, finance              owner-agents
#
# Cross-room hand-offs happen because an agent sits in both rooms: the
# concierge carries reports from the public helpdesk into ops, and the
# sponsor tracker carries tournament results from ops into finance. Every
# Switch agent operation acts on the one room its session is connected to,
# so an agent crosses over with list_linked_rooms -> connect_to_room. The
# group's `links:` are what list_linked_rooms returns: labelled pointers,
# with no access of their own.
#
# Documents. Switch lets only the agent that created a room document update
# it, and documents a template provisions have no creating agent. So the
# documents below are the deploy-time baseline, read-only to everyone. At
# kickoff the marshal copies bracket_state.json to bracket_live.json and the
# tracker copies sponsor_ledger.json to ledger_live.json. Each agent created
# its live copy, so Switch itself guarantees it is the only writer.
version: 2

params:
  fest:
    type: string
    label: Fest name
    description: Short, lowercase name of your fest. Every room and agent name starts with it.
    default: techstorm
    pattern: "[a-z][a-z0-9-]*"
  bridge:
    type: bridge
    label: Messaging app
    description: >-
      Where the three rooms are created (Discord, Slack, Mattermost…). Leave it
      empty on a server with no messaging app: the rooms are then Switch-only.
    default: [$first]
    required: false
  provider:
    type: provider
    description: The coding agent that runs all three FestCommand agents.
    default: [claude, codex, opencode]
    input: advanced
  machine:
    type: machine
    description: The machine the agents run on.
    default: [$first]
    input: advanced
  agents_dir:
    type: directory
    description: Parent directory; each agent gets its own folder inside it.
    default: "{$agents_dir}"
    input: advanced

form:
  advanced: { label: Advanced, open: false }

resources:
  # ─────────────────────────────── agents ───────────────────────────────
  concierge:
    type: agent
    name: "{fest}-concierge"
    display_name: "{fest} Concierge"
    description: >-
      Public helpdesk: answers participant questions from the schedule, files
      match results and disputes with tournament ops, announces approved
      outcomes.
    provider: "{provider}"
    machine: "{machine}"
    directory: "{agents_dir}/{fest}-concierge"
    addressing: { anyone_in: [helpdesk, ops] }
    instructions: "@include agents/concierge/SKILL.md"

  bracket_marshal:
    type: agent
    name: "{fest}-bracket-marshal"
    display_name: "{fest} Bracket Marshal"
    description: >-
      Tournament ops: validates results, rules on disputes, proposes schedule
      shifts. Changes bracket_state.json only after the Fest Lead approves.
    provider: "{provider}"
    machine: "{machine}"
    directory: "{agents_dir}/{fest}-bracket-marshal"
    addressing: owner-agents
    instructions: "@include agents/bracket-marshal/SKILL.md"

  sponsor_tracker:
    type: agent
    name: "{fest}-sponsor-tracker"
    display_name: "{fest} Sponsor Tracker"
    description: >-
      Sponsors & finance: deliverable dashboards, budget alerts, vendor
      payments and prize payouts, each gated on Fest Lead approval.
    provider: "{provider}"
    machine: "{machine}"
    directory: "{agents_dir}/{fest}-sponsor-tracker"
    addressing: owner-agents
    instructions: "@include agents/sponsor-tracker/SKILL.md"

  # ─────────────────────────────── group ────────────────────────────────
  war_room:
    type: group
    name: "{fest} FestCommand"
    description: The three FestCommand rooms and the hand-offs between them.
    color: purple
    links:
      - { from: helpdesk, to: ops, label: "disputes & match results" }
      - { from: ops, to: helpdesk, label: "approved announcements" }
      - { from: ops, to: finance, label: "tournament complete → payouts" }

  # ─────────────────────────────── rooms ────────────────────────────────
  helpdesk:
    type: room
    group: war_room
    name: "{fest}-public-helpdesk"
    description: Ask about schedules, rules, venue, merch; report match results and disputes.
    channel_type: channel_public
    bridge: "{bridge}"
    agents: [concierge]
    users:
      - if: "{bridge}"
        value: ["{$creator}"]
      - value: []
    instructions: |
      Welcome to the **{fest} Public Helpdesk** 🎮

      Ask @{concierge.name} about:
      - 📅 Match times, stages and check-in
      - 📋 Game rules and formats
      - 🗺️ Venue map, sponsor booths, merch (Booth B6)
      - 🎭 Cosplay registration and judging

      Report a **match result** or a **dispute** here, with the match ID and
      a screenshot link. It goes to the ops team, and a human makes every
      ruling.

      Every approved result, ruling and schedule change is logged in the
      room document announcements.md.
    docs:
      - name: schedule_and_rules.md
        description: Published schedule, rulebook, prize structure, venue and contacts (as of deploy).
        instructions: >-
          Answer participants from this. A newer entry in announcements.md
          (results, rulings, schedule changes) overrides it.
        content: "@include documents/schedule_and_rules.md"
    kickoff: |
      @{concierge.name} you're live. If this room has no announcements.md yet,
      create it (create_room_document) as an empty log. Then post a short
      welcome for participants: what you can help with, and how to report a
      result or a dispute.

  ops:
    type: room
    group: war_room
    name: "{fest}-tournament-ops"
    description: Private. Result validation, dispute rulings, schedule shifts, with Fest Lead approval on each.
    channel_type: channel_private
    bridge: "{bridge}"
    agents: [bracket_marshal, concierge, sponsor_tracker]
    users:
      - if: "{bridge}"
        value: ["{$creator}"]
      - value: []
    instructions: |
      🔒 **{fest} Tournament Ops.** Fest Lead and agents only.

      - @{concierge.name} brings in results and disputes from the helpdesk.
      - @{bracket_marshal.name} validates them and asks for approval.
      - @{sponsor_tracker.name} picks up finished tournaments for payouts.

      Approve with the exact line the marshal gives you, e.g.
      `approve MATCH-06 #3f9a`. Reject with `reject MATCH-06 #3f9a`.
      Approvals typed by agents never count.
    docs:
      - name: bracket_state.json
        description: Every bracket as of deploy, plus pending approvals and the audit log. Read-only baseline.
        instructions: >-
          Baseline only; no agent can edit it. The bracket marshal copies it to
          bracket_live.json at kickoff and keeps that copy. Read bracket_live.json
          for current state.
        content: "@include documents/bracket_state.json"
      - name: schedule_and_rules.md
        description: Published schedule, rulebook, prize structure, venue and contacts (as of deploy).
        instructions: >-
          Cite it in rulings. Approved schedule changes live in
          bracket_live.json (scheduled_time), which overrides the times here.
        content: "@include documents/schedule_and_rules.md"
    kickoff: |
      @{bracket_marshal.name} you're live. If this room has no
      bracket_live.json yet, create it (create_room_document) with the exact
      content of bracket_state.json; from now on you only ever update that
      copy. Then post a one-screen status: matches awaiting a result, open
      disputes, and the next three scheduled matches.

  finance:
    type: room
    group: war_room
    name: "{fest}-sponsor-finance"
    description: Private. Sponsor deliverables, budget, vendor payments and prize payouts.
    channel_type: channel_private
    bridge: "{bridge}"
    agents: [sponsor_tracker]
    users:
      - if: "{bridge}"
        value: ["{$creator}"]
      - value: []
    instructions: |
      💰 **{fest} Sponsor & Finance.** Fest Lead only.

      @{sponsor_tracker.name} keeps ledger_live.json and asks you to approve
      every payout, vendor payment and reserve withdrawal, e.g.
      `approve VENDOR-03 #79e1`.
    docs:
      - name: sponsor_ledger.json
        description: Income, budget by category, sponsor deliverables, prize pool, vendor payments, alerts and audit log, as of deploy. Read-only baseline.
        instructions: >-
          Baseline only; no agent can edit it. The sponsor tracker copies it to
          ledger_live.json at kickoff and updates that copy only after a Fest
          Lead approval. Read ledger_live.json for current figures.
        content: "@include documents/sponsor_ledger.json"
    kickoff: |
      @{sponsor_tracker.name} you're live. If this room has no ledger_live.json
      yet, create it (create_room_document) with the exact content of
      sponsor_ledger.json; from now on you only ever update that copy. Then
      post the sponsor status dashboard, open alerts and anything waiting for
      my approval.
