name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml ruff==0.6.9
      - name: Lint
        run: ruff check scripts tests
      - name: Live check script compiles and parses its arguments
        run: python scripts/live_check.py --help
      - name: Template is built from current sources
        run: python scripts/build_template.py --check
      - name: Documents and template are consistent
        run: python scripts/validate.py
      - name: Rehearsal runs end to end
        run: python scripts/rehearse.py --fast --no-color
      - name: Validator catches every class of mistake it claims to
        run: python -m unittest discover -s tests -v
